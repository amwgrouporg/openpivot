<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenPivot</title>
<meta name="description" content="An agent-driven investigation board over the open web's public record, exposed through WebMCP.">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="mark">OP</span><span>OpenPivot</span></div>
  <div class="sep"></div>
  <input id="case-title" class="case-title" type="text" aria-label="Case title" placeholder="Case title" spellcheck="false">
  <div class="grow"></div>
  <div class="stats" id="stats"></div>
  <div class="sep"></div>
  <button id="btn-export" class="btn">Export</button>
  <button id="btn-new" class="btn">New case</button>
</header>
<main class="workspace">
  <section class="canvas">
    <div class="canvas-toolbar">
      <button class="btn" data-graph="fit" title="Fit to view">fit</button>
      <button class="btn" data-graph="in" title="Zoom in">+</button>
      <button class="btn" data-graph="out" title="Zoom out">-</button>
      <span class="grow"></span>
      <div class="legend" id="legend"></div>
    </div>
    <svg id="graph" role="img" aria-label="Entity graph"></svg>
    <div class="canvas-empty" id="canvas-empty" hidden>no entities on the board</div>
  </section>
  <section class="inspector">
    <nav class="tabs" id="tabs">
      <button data-tab="entities">Entities<span class="count" data-count="entities"></span></button>
      <button data-tab="links">Links<span class="count" data-count="links"></span></button>
      <button data-tab="evidence">Evidence<span class="count" data-count="evidence"></span></button>
      <button data-tab="readings">Readings<span class="count" data-count="readings"></span></button>
      <button data-tab="memo">Memo</button>
      <button data-tab="log">Log</button>
    </nav>
    <div id="panel-body" class="panel-body"></div>
  </section>
</main>
<footer class="statusbar" id="foot"></footer>
<script src="/vendor/d3.v7.9.0.min.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
