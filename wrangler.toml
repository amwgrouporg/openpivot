name = "openpivot"
main = "src/worker.js"
compatibility_date = "2026-08-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Every request passes through the Worker so the security headers in src/headers.js reach
# the board page and its assets too; by default matched files would be answered before it.
run_worker_first = true

[observability]
enabled = true

# Per-client rate limit on /api/*: 60 sensor calls per minute.
# Layer 1: a Durable Object per client key, exact and shared across all isolates.
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"]

# Layer 2: the Cloudflare rate-limit binding (approximate, per location).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
